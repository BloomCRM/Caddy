<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloom — CRM для б'юті-бізнесу</title>
  <meta name="description" content="Bloom — CRM для перукарень, барбершопів і салонів краси." />
  <style>
    :root{ --bg:#F6F5F1; --surface:#FFFFFF; --text:#22231F; --muted:#74746B;
           --primary:#2D6A4F; --primary-hover:#235640; --accent:#C8895A; --border:#E6E4DC; }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{background:var(--bg);color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;line-height:1.5}
    .card{max-width:560px;width:100%;text-align:center}
    .logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:28px;letter-spacing:-.02em}
    .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
    h1{font-size:clamp(28px,6vw,44px);margin:24px 0 8px;letter-spacing:-.02em}
    p.tag{color:var(--muted);font-size:18px;margin:0 0 28px}
    .soon{display:inline-block;font-size:13px;font-weight:600;color:var(--primary);
          background:#E3F1E8;border:1px solid #CDE7D8;border-radius:999px;padding:6px 14px;margin-bottom:28px}
    .cta{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;font-weight:600;
         padding:13px 26px;border-radius:11px;transition:background .15s}
    .cta:hover{background:var(--primary-hover)}
    footer{margin-top:40px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><span class="dot"></span>Bloom</div>
    <h1>CRM для б'юті-бізнесу</h1>
    <p class="tag">Записи, клієнти, майстри, нагадування — в одному місці.</p>
    <div class="soon">Скоро тут буде більше ✨</div>
    <div><a class="cta" href="/app/">Увійти</a></div>
    <footer>© Bloom</footer>
  </main>
</body>
</html>
